[[case]]
name = "not_equal_style_prefers_angle"
sql = "SELECT * FROM foo WHERE a != b"
config = { lints = { not_equal_style = { level = "warn", preferred = "angle" } } }
expect = [{ code = "not_equal_style" }]
fixed_sql = "SELECT * FROM foo WHERE a <> b"

[[case]]
name = "null_comparison_uses_is"
sql = "SELECT * FROM foo WHERE a = NULL"
expect = [{ code = "null_comparison" }]
fixed_sql = "SELECT * FROM foo WHERE a IS NULL"

[[case]]
name = "count_rows_prefers_star"
sql = "SELECT COUNT(1) FROM foo"
expect = [{ code = "count_rows" }]
fixed_sql = "SELECT COUNT(*) FROM foo"

[[case]]
name = "count_rows_ignores_nested_literals"
sql = "SELECT COUNT(CASE WHEN x THEN 1 ELSE 0 END) FROM foo"
expect = []

[[case]]
name = "order_by_direction_requires_all_items"
sql = "SELECT a, b FROM foo ORDER BY a, b DESC"
expect = [{ code = "order_by_direction" }]
fixed_sql = "SELECT a, b FROM foo ORDER BY a ASC, b DESC"

[[case]]
name = "order_by_direction_inserts_before_nulls_last"
sql = "SELECT a, b FROM foo ORDER BY a NULLS LAST, b DESC"
expect = [{ code = "order_by_direction" }]
fixed_sql = "SELECT a, b FROM foo ORDER BY a ASC NULLS LAST, b DESC"

[[case]]
name = "order_by_direction_handles_existing_nulls_first_modifier"
sql = "SELECT a, b FROM foo ORDER BY a DESC NULLS FIRST, b"
expect = [{ code = "order_by_direction" }]
fixed_sql = "SELECT a, b FROM foo ORDER BY a DESC NULLS FIRST, b ASC"

[[case]]
name = "require_order_by_for_limit"
sql = "SELECT * FROM foo LIMIT 10"
expect = [{ code = "require_order_by", message = "LIMIT clauses, including LIMIT ... OFFSET, require ORDER BY for deterministic results." }]

[[case]]
name = "require_order_by_for_limit_offset"
sql = "SELECT * FROM foo LIMIT 10 OFFSET 20"
expect = [{ code = "require_order_by", message = "LIMIT clauses, including LIMIT ... OFFSET, require ORDER BY for deterministic results." }]

[[case]]
name = "require_order_by_ignores_limit_offset_with_order_by"
sql = "SELECT * FROM foo ORDER BY id LIMIT 10 OFFSET 20"

[[case]]
name = "require_order_by_ignores_limit_with_order_by"
sql = "SELECT * FROM foo ORDER BY id LIMIT 10"
